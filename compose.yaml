services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: foresttrack
      POSTGRES_USER: foresttrack
      POSTGRES_PASSWORD: foresttrack_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - foresttrack-postgres-data:/var/lib/postgresql

volumes:
  foresttrack-postgres-data:
